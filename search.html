<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo-Research - ค้นหาสินค้าด้วยรูปภาพ</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- TensorFlow.js and MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    <!-- ZXing for Barcode -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>ค้นหาสินค้าด้วยรูปภาพ</h1>
            <nav>
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
                <a href="input.html" class="btn btn-primary">เพิ่มสินค้า</a>
            </nav>
        </header>

        <main>
            <div class="card search-box">
                <!-- ระบบเลือก 2 แบบ: 1 ถ่ายจากกล้อง 2 เลือกจากคลัง -->
                <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
                    <label class="btn btn-primary" style="margin: 0; cursor: pointer;">
                        📷 1. ถ่ายจากกล้อง
                        <input type="file" id="camera-search-file" accept="image/*" capture="environment" style="display: none;">
                    </label>
                    <label class="btn btn-secondary" style="margin: 0; cursor: pointer;">
                        🖼️ 2. เลือกจากคลัง
                        <input type="file" id="gallery-search-file" accept="image/*" style="display: none;">
                    </label>
                </div>

                <!-- พรีวิวรูปภาพที่เลือก -->
                <div id="preview-wrapper" style="display: none; text-align: center; margin-bottom: 15px;">
                    <img id="image-preview" src="" alt="พรีวิวภาพค้นหา" style="max-height: 220px; border-radius: var(--radius, 6px); border: 1px solid #ddd;">
                </div>

                <!-- ปุ่มกดค้นหา (มีปุ่มนี้เพื่อให้ผู้ใช้กดยืนยันการค้นหาได้ชัดเจน) -->
                <button type="button" id="start-search-btn" class="btn btn-primary" style="width: 100%; display: none;">
                    🔍 เริ่มค้นหาสินค้า
                </button>
            </div>

            <!-- สถานะแจ้งกำลังค้นหา -->
            <div id="status-card" class="card status-card" style="display: none;">
                <div class="spinner"></div>
                <p id="status-text">กำลังค้นหาข้อมูล...</p>
            </div>

            <!-- รายการผลลัพธ์ -->
            <div id="results-container" class="results-container"></div>
        </main>
    </div>

    <!-- Modal กดเข้าไปดูรูปภาพอื่นๆ ของสินค้า -->
    <div id="image-modal" class="modal" style="display: none;">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 id="modal-product-title" style="margin: 0;">รูปภาพทั้งหมด</h3>
                <span id="close-modal-btn" style="font-size: 24px; cursor: pointer; line-height: 1;">&times;</span>
            </div>
            <div id="modal-tags" style="margin-bottom: 10px;"></div>
            <div id="modal-images-grid" style="display: flex; flex-wrap: wrap; gap: 10px; max-height: 60vh; overflow-y: auto;"></div>
        </div>
    </div>

    <script type="module" src="src/app-search.js"></script>
</body>
</html>
