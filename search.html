<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหาสินค้า - Photo Research</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>ค้นหาสินค้า</h1>
      <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="input.html">เพิ่มสินค้า</a>
      </nav>
    </header>

    <main>
      <div class="card">
        <label>เลือกรูปแบบการค้นหาด้วยภาพ:</label>
        <div class="btn-group">
          <!-- 1. ถ่ายจากกล้องเพื่อค้นหา -->
          <label class="btn btn-primary">
            📷 ถ่ายจากกล้อง
            <input type="file" id="cameraSearchInput" accept="image/*" capture="environment" style="display: none;">
          </label>

          <!-- 2. เลือกจากคลังรูปภาพเพื่อค้นหา -->
          <label class="btn btn-secondary">
            🖼️ เลือกจากคลังรูปภาพ
            <input type="file" id="gallerySearchInput" accept="image/*" style="display: none;">
          </label>
        </div>

        <div id="searchPreview" class="search-preview-box" style="display: none;">
          <img id="queryImage" src="" alt="ภาพที่ใช้ค้นหา">
        </div>
      </div>

      <div id="loadingStatus" class="status-msg" style="display: none;">กำลังค้นหาข้อมูล...</div>

      <section id="resultsSection" class="results-grid"></section>
    </main>
  </div>

  <!-- Modal สำหรับกดเข้าไปดูรูปภาพอื่นๆ ของสินค้า -->
  <div id="galleryModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalProductName">รูปภาพสินค้าทั้งหมด</h3>
        <span class="close-btn" id="closeModalBtn">&times;</span>
      </div>
      <div id="modalTags" class="modal-tags"></div>
      <div id="modalImagesContainer" class="modal-images-grid"></div>
    </div>
  </div>

  <script type="module" src="src/app-search.js"></script>
</body>
</html>
