<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพิ่มสินค้า - Photo Research</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>เพิ่มสินค้าใหม่</h1>
      <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="search.html">ค้นหา</a>
      </nav>
    </header>

    <main>
      <form id="productForm" class="card">
        <div class="form-group">
          <label for="barcodeInput">บาร์โค้ด (ถ้ามี):</label>
          <input type="text" id="barcodeInput" placeholder="กรอกหรือสแกนบาร์โค้ด">
        </div>

        <div class="form-group">
          <label for="nameInput">ชื่อสินค้า / คำอธิบาย <span class="required">*</span>:</label>
          <input type="text" id="nameInput" required placeholder="ระบุชื่อสินค้า">
        </div>

        <!-- ช่อง Tags (ไม่บังคับ) -->
        <div class="form-group">
          <label for="tagsInput">Tags / ป้ายกำกับ (คั่นด้วยจุลภาค เช่น สีดำ, กล่อง, เสื้อผ้า):</label>
          <input type="text" id="tagsInput" placeholder="ไม่บังคับกรอก">
        </div>

        <div class="form-group">
          <label>รูปภาพสินค้า (อย่างน้อย 1 รูป):</label>
          <div class="btn-group">
            <!-- 1. ถ่ายจากกล้อง -->
            <label class="btn btn-secondary">
              📷 ถ่ายจากกล้อง
              <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            </label>

            <!-- 2. เลือกจากคลัง (หลายรูป) -->
            <label class="btn btn-secondary">
              🖼️ เลือกจากคลังรูปภาพ
              <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">
            </label>
          </div>

          <!-- แสดงรายการพรีวิวรูปภาพทั้งหมดที่เลือกไว้ -->
          <div id="previewContainer" class="preview-grid"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">บันทึกสินค้า</button>
      </form>
    </main>
  </div>

  <script type="module" src="src/app-input.js"></script>
</body>
</html>
