<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพิ่มสินค้า - Photo Research</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>เพิ่มข้อมูลสินค้า</h1>
      <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="search.html">ค้นหา</a>
      </nav>
    </header>

    <main>
      <form id="productForm">
        <div class="form-group">
          <label for="barcodeInput">บาร์โค้ด:</label>
          <input type="text" id="barcodeInput" required placeholder="กรอกบาร์โค้ดสินค้า">
        </div>

        <div class="form-group">
          <label for="nameInput">ชื่อสินค้า:</label>
          <input type="text" id="nameInput" required placeholder="กรอกชื่อสินค้า">
        </div>

        <!-- ระบบคีย์ Tags (ไม่บังคับ) -->
        <div class="form-group">
          <label for="tagsInput">Tags (ไม่บังคับ คั่นด้วยจุลภาค เช่น สีแดง, พลาสติก):</label>
          <input type="text" id="tagsInput" placeholder="tag1, tag2, tag3">
        </div>

        <!-- ระบบเพิ่มรูปภาพ: ถ่ายจากกล้องได้เรื่อยๆ / เลือกจากคลังหลายรูป -->
        <div class="form-group">
          <label>รูปภาพสินค้า (เลือกหรือถ่ายได้หลายรูป):</label>
          <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <label style="padding: 8px 12px; background: #007bff; color: white; border-radius: 4px; cursor: pointer;">
              📷 ถ่ายจากกล้อง
              <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            </label>
            <label style="padding: 8px 12px; background: #6c757d; color: white; border-radius: 4px; cursor: pointer;">
              🖼️ เลือกจากคลัง (หลายรูป)
              <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">
            </label>
          </div>
          <div id="imagePreviewContainer" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;"></div>
        </div>

        <button type="submit" id="submitBtn" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">บันทึกสินค้า</button>
      </form>
    </main>
  </div>

  <script type="module" src="src/app-input.js"></script>
</body>
</html>
