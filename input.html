<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เพิ่มข้อมูลสินค้า</title>
<link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>
  <div class="nav">
    <a href="index.html">🏠 หน้าแรก</a>
    <a href="input.html" class="active">➕ เพิ่มข้อมูล</a>
    <a href="search.html">🔍 ค้นหา</a>
  </div>

  <h1>เพิ่มข้อมูลสินค้า</h1>
  <div class="subtitle">ถ่ายรูป + กรอก Barcode เพื่อเพิ่มเข้าฐานข้อมูล</div>

  <div class="card">
    <label>รูปสินค้า (ถ่ายซ้ำได้หลายครั้ง หรือเลือกจากคลังหลายรูป)</label>

    <div class="capture-row">
      <button type="button" id="cameraBtn" class="capture-btn btn-camera">📷 ถ่ายจากกล้อง</button>
      <button type="button" id="galleryBtn" class="capture-btn btn-gallery">🖼️ เลือกจากคลัง</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />
    <input type="file" id="galleryInput" accept="image/*" multiple style="display:none;" />

    <div id="photoThumbs" class="thumb-list"></div>
    <div id="photoThumbCount" class="thumb-count"></div>

    <label style="display:block; margin-top:12px;">Barcode</label>
    <input type="text" id="barcodeInput" placeholder="กรอกหรือสแกน Barcode" inputmode="numeric" />

    <label style="display:block; margin-top:12px;">Tags (ไม่บังคับ)</label>
    <input type="text" id="tagsInput" placeholder="เช่น ทอง, สร้อยคอ, งานแต่ง (คั่นด้วยจุลภาค)" />

    <div class="btn-row">
      <button id="addBtn" class="btn-green">➕ เพิ่มเข้าฐานข้อมูล</button>
    </div>
    <div id="status" class="status-text">กำลังเตรียมระบบ...</div>
    <div id="photoCount"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

  <script src="src/masterLoader.js?v=2"></script>
  <script src="src/db.js?v=4"></script>
  <script src="src/vision.js?v=2"></script>
  <script src="src/app-input.js?v=2"></script>
</body>
</html>
